version: '3.8'

services:
  core_api:
    image: python:3.12-slim
    container_name: core_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn core_api:app --host 0.0.0.0 --port 8000"

  wan_router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: wan_router
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      wan_net:
        ipv4_address: 172.20.0.10
      lan1_net:
        ipv4_address: 10.199.2.10
      lan2_net:
        ipv4_address: 10.199.3.10
    ports:
      - "2222:22" # External SSH
    command: /setup_router.sh

  lan_switch1:
    image: alpine:latest
    container_name: lan_switch1
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache openvswitch iproute2 iptables &&
        /usr/share/openvswitch/scripts/ovs-ctl start &&
        ovs-vsctl --may-exist add-br br-lan1 -- set bridge br-lan1 datapath_type=netdev &&
        ovs-ofctl add-flow br-lan1 \"priority=0,actions=NORMAL\" &&
        sleep infinity
      "
    networks:
      lan1_net:
        ipv4_address: 10.199.2.20

  lan_switch2:
    image: alpine:latest
    container_name: lan_switch2
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache openvswitch iproute2 iptables &&
        /usr/share/openvswitch/scripts/ovs-ctl start &&
        ovs-vsctl --may-exist add-br br-lan2 -- set bridge br-lan2 datapath_type=netdev &&
        ovs-ofctl add-flow br-lan2 \"priority=0,actions=NORMAL\" &&
        sleep infinity
      "
    networks:
      lan2_net:
        ipv4_address: 10.199.3.20

  lightweight_server1:
    image: nginx:alpine
    container_name: server1
    cap_add:
      - NET_ADMIN
    networks:
      lan1_net:
        ipv4_address: 10.199.2.100
    ports:
      - "8081:80"
    command: sh -c "ip route del default || true && ip route add default via 10.199.2.10 && nginx -g 'daemon off;'"

  lightweight_server2:
    image: python:alpine
    container_name: server2
    cap_add:
      - NET_ADMIN
    networks:
      lan2_net:
        ipv4_address: 10.199.3.100
    ports:
      - "8082:80"
    command: sh -c "ip route del default || true && ip route add default via 10.199.3.10 && echo 'Server 2 OK' > index.html && python -m http.server 80"

  telemetry_sniffer:
    build:
      context: .
      dockerfile: Dockerfile.sniffer
    container_name: telemetry_sniffer
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - API_URI=ws://127.0.0.1:8000/ws/network_state
      - IFACE=any
    depends_on:
      - core_api

  ui_dashboard:
    image: python:3.12-slim
    container_name: ui_dashboard
    ports:
      - "8501:8501" 
    volumes:
      - ./dashboard.py:/app/dashboard.py
    working_dir: /app
    command: sh -c "pip install streamlit requests pandas && streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      - API_URI=http://core_api:8000/api/state
    depends_on:
      - core_api

networks:
  wan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  lan1_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.2.0/24
  lan2_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.3.0/24