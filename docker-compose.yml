version: '3.8'

services:
  gateway:
    image: alpine:latest
    container_name: gateway
    privileged: true # REQUIRED for iptables
    volumes:
      - ./setup-router.sh:/setup-router.sh:ro
    command: sh -c "apk add iptables && chmod +x /setup-router.sh && /setup-router.sh"
    networks:
      - lab_net

  victim_server:
    image: nginx:alpine
    container_name: victim_server
    networks:
      - lab_net

  attacker_client:
    image: python:alpine
    container_name: attacker_client
    command: tail -f /dev/null
    networks:
      - lab_net

networks:
  lab_net:
    driver: bridge