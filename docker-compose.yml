version: '3.8'

services:
  core_api:
    image: python:3.12-slim
    container_name: core_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn core_api:app --host 0.0.0.0 --port 8000"

  sdn_router:
    image: alpine:latest
    container_name: sdn_router
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache iptables iproute2 &&
        sysctl -w net.ipv4.ip_forward=1 &&
        iptables -P FORWARD ACCEPT &&
        ip route add 10.199.2.0/24 via 10.199.1.20 &&
        sleep infinity
      "
    networks:
      wan_network:
        ipv4_address: 10.199.4.10
      transit_network:
        ipv4_address: 10.199.1.10

  core_switch:
    image: alpine:latest
    container_name: core_switch
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache openvswitch iproute2 iptables &&
        sysctl -w net.ipv4.ip_forward=1 &&
        iptables -P FORWARD ACCEPT &&
        /usr/share/openvswitch/scripts/ovs-ctl start &&
        ovs-vsctl --may-exist add-br br-core -- set bridge br-core datapath_type=netdev &&
        ovs-vsctl --may-exist add-port br-core eth0 &&
        ovs-vsctl --may-exist add-port br-core eth1 &&
        ip addr flush dev eth0 &&
        ip addr flush dev eth1 &&
        ip addr add 10.199.1.20/24 dev br-core &&
        ip addr add 10.199.2.20/24 dev br-core &&
        ip link set br-core up &&
        ovs-ofctl add-flow br-core \"priority=0,actions=NORMAL\" &&
        sleep infinity
      "
    networks:
      transit_network:
        ipv4_address: 10.199.1.20
      admin_network:
        ipv4_address: 10.199.2.20

  admin_web_server:
    image: nginx:alpine
    container_name: admin_web_server
    cap_add:
      - NET_ADMIN
    command: sh -c "sleep 3 && ip route del default || true && ip route add default via 10.199.2.20 && nginx -g 'daemon off;'"
    networks:
      admin_network:
        ipv4_address: 10.199.2.100

  external_client:
    image: python:alpine
    container_name: external_client
    cap_add:
      - NET_ADMIN
    command: sh -c "sleep 3 && ip route del default || true && ip route add 10.199.0.0/16 via 10.199.4.10 && tail -f /dev/null"
    networks:
      wan_network:
        ipv4_address: 10.199.4.100

  telemetry_sniffer:
    build:
      context: .
      dockerfile: Dockerfile.sniffer
    container_name: telemetry_sniffer
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - API_URI=ws://127.0.0.1:8000/ws/network_state
    depends_on:
      - core_api

  ui_dashboard:
    image: python:3.12-slim
    container_name: ui_dashboard
    ports:
      - "8501:8501" 
    volumes:
      - ./dashboard.py:/app/dashboard.py
    working_dir: /app
    command: sh -c "pip install streamlit requests pandas && streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      - API_URI=http://core_api:8000/api/state
    depends_on:
      - core_api

networks:
  wan_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.4.0/24
  transit_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.1.0/24
  admin_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.2.0/24