services:
  core_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: core_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/state')"]
      interval: 10s
      timeout: 5s
      retries: 3

  wan_router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: wan_router
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      wan_net:
        ipv4_address: 172.20.0.10
      lan1_net:
        ipv4_address: 10.199.2.10
      lan2_net:
        ipv4_address: 10.199.3.10
      ai_net: {}
    ports:
      - "2222:22"
    command: /setup_router.sh

  lan_switch1:
    image: alpine:latest
    container_name: lan_switch1
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache openvswitch iproute2 iptables &&
        /usr/share/openvswitch/scripts/ovs-ctl start || true;
        sleep 2 &&
        ovs-vsctl --may-exist add-br br-lan1 -- set bridge br-lan1 datapath_type=netdev &&
        ovs-ofctl add-flow br-lan1 \"priority=0,actions=NORMAL\" &&
        sleep infinity
      "
    networks:
      lan1_net:
        ipv4_address: 10.199.2.20

  lan_switch2:
    image: alpine:latest
    container_name: lan_switch2
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache openvswitch iproute2 iptables &&
        /usr/share/openvswitch/scripts/ovs-ctl start || true;
        sleep 2 &&
        ovs-vsctl --may-exist add-br br-lan2 -- set bridge br-lan2 datapath_type=netdev &&
        ovs-ofctl add-flow br-lan2 \"priority=0,actions=NORMAL\" &&
        sleep infinity
      "
    networks:
      lan2_net:
        ipv4_address: 10.199.3.20

  lightweight_server1:
    image: nginx:alpine
    container_name: server1
    cap_add:
      - NET_ADMIN
    networks:
      lan1_net:
        ipv4_address: 10.199.2.100
    ports:
      - "8081:80"
    command: sh -c "ip route del default || true && ip route add default via 10.199.2.10 && nginx -g 'daemon off;'"

  lightweight_server2:
    image: python:alpine
    container_name: server2
    cap_add:
      - NET_ADMIN
    networks:
      lan2_net:
        ipv4_address: 10.199.3.100
    ports:
      - "8082:80"
    command: sh -c "ip route del default || true && ip route add default via 10.199.3.10 && echo 'Server 2 OK' > /tmp/index.html && cd /tmp && python -m http.server 80"

  telemetry_sniffer:
    build:
      context: .
      dockerfile: Dockerfile.sniffer
    container_name: telemetry_sniffer
    network_mode: "service:wan_router"
    privileged: true
    restart: unless-stopped
    environment:
      - API_URI=ws://core_api:8000/ws/network_state
      - PYTHONUNBUFFERED=1
    depends_on:
      core_api:
        condition: service_healthy
      wan_router:
        condition: service_started

  ui_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ui_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard.py:/app/dashboard.py
    environment:
      - API_URI=http://core_api:8000/api/state
      - PYTHONUNBUFFERED=1
    networks:
      - ai_net
    depends_on:
      core_api:
        condition: service_healthy
    
  external_attacker:
    image: alpine:latest
    container_name: external_attacker
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      wan_net:
        ipv4_address: 172.20.0.50
    command: >
      sh -c "
        apk add --no-cache curl nmap iproute2 &&
        ip route replace default via 172.20.0.10 || true &&
        sleep infinity
      "

networks:
  ai_net:
    driver: bridge
  wan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  lan1_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.2.0/24
  lan2_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.3.0/24
